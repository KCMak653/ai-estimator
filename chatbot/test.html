<div id="direct-windows-estimator">
  <div class="estimator-box">
    <div class="ai-badge">AI POWERED</div>
    <h2 class="est-title">Quick Window Estimate</h2>
    <p class="est-text">Describe your windows and get a realistic price range in under a minute.</p>

    <div class="chat-shell">
      <div class="chat-header">
        <div class="chat-title">Window Estimator</div>
        <div class="chat-subtitle">Try: "2 casements 36x60, 1 picture 48x48"</div>
      </div>

      <div id="dw-chat-messages" class="chat-messages" aria-live="polite"></div>

      <div class="chat-input-row">
        <input id="dw-chat-input" class="chat-input" type="text"
          placeholder="Type window sizes + types (e.g., 36x60 casement)..." autocomplete="off" />
        <button id="dw-chat-send" class="chat-send" type="button">Send</button>
      </div>

      <div class="chat-hint">
        Tip: Include window type (casement / slider / picture) + size (W x H).
      </div>
    </div>
  </div>
</div>

<style>
  #direct-windows-estimator { width: 100%; padding: 40px 0; display: flex; justify-content: center; }
  #direct-windows-estimator .estimator-box {
    max-width: 720px; width: 92%; padding: 56px 20px; background: #fff; border: 3px solid #1AB1AD;
    border-radius: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }
  #direct-windows-estimator .ai-badge {
    display: inline-block; padding: 4px 12px; background: #1AB1AD; color: white; border-radius: 999px;
    font-size: 10px; font-weight: bold; margin-bottom: 12px; letter-spacing: 0.4px;
  }
  #direct-windows-estimator .est-title { color: #343D46 !important; margin-bottom: 8px !important; font-size: 28px !important; line-height: 1.2; }
  #direct-windows-estimator .est-text { color: #718096 !important; font-size: 14px !important; margin-bottom: 22px !important; }
  #direct-windows-estimator .chat-shell {
    margin: 0 auto; max-width: 560px; text-align: left; border: 1px solid #e2e8f0;
    border-radius: 14px; overflow: hidden; background: #fff;
  }
  #direct-windows-estimator .chat-header { padding: 14px 16px; background: #000; color: #fff; }
  #direct-windows-estimator .chat-title { font-weight: 800; font-size: 14px; letter-spacing: 0.2px; }
  #direct-windows-estimator .chat-subtitle { margin-top: 4px; font-size: 12px; opacity: 0.85; }
  #direct-windows-estimator .chat-messages {
    height: 320px; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa;
  }
  #direct-windows-estimator .msg {
    max-width: 88%; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.35;
    border: 1px solid rgba(0,0,0,0.06); word-wrap: break-word; white-space: pre-wrap;
  }
  #direct-windows-estimator .msg.user { align-self: flex-end; background: #e3f2fd; }
  #direct-windows-estimator .msg.ai { align-self: flex-start; background: #fff; }
  #direct-windows-estimator .typing-indicator {
    display: flex; gap: 4px; padding: 12px 16px; background: #fff; border: 1px solid rgba(0,0,0,0.06);
    border-radius: 12px; width: fit-content; align-self: flex-start;
  }
  #direct-windows-estimator .typing-dot {
    width: 6px; height: 6px; background: #1AB1AD; border-radius: 50%;
    animation: dw-bounce 1.4s infinite ease-in-out both;
  }
  #direct-windows-estimator .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  #direct-windows-estimator .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes dw-bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
  #direct-windows-estimator .msg.ai strong { font-weight: bold !important; }
  #direct-windows-estimator .msg.ai ul { margin-left: 18px !important; list-style: disc !important; margin-top: 5px !important; }
  #direct-windows-estimator .msg.system {
    align-self: center; background: #fff7d6; border-color: rgba(0,0,0,0.08); font-size: 12px; max-width: 95%;
  }
  #direct-windows-estimator .chat-input-row { display: flex; gap: 10px; padding: 12px; border-top: 1px solid #e2e8f0; background: #fff; }
  #direct-windows-estimator .chat-input {
    flex: 1; height: 44px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 0 12px; outline: none; font-size: 13px;
  }
  #direct-windows-estimator .chat-input:focus { border-color: #1AB1AD; box-shadow: 0 0 0 3px rgba(26,177,173,0.15); }
  #direct-windows-estimator .chat-send {
    height: 44px; min-width: 92px; background: #FDD20E; color: #000; border: none; border-radius: 10px; font-weight: 800; cursor: pointer;
  }
  #direct-windows-estimator .chat-send:disabled { opacity: 0.6; cursor: not-allowed; }
  #direct-windows-estimator .chat-hint { padding: 10px 14px 14px; font-size: 12px; color: #718096; background: #fff; }
  @media (max-width: 480px) {
    #direct-windows-estimator .chat-messages { height: 280px; }
    #direct-windows-estimator .estimator-box { padding: 44px 16px; }
    #direct-windows-estimator .chat-send { min-width: 76px; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  const CHAT_API_URL = 'https://window-chatbot-production.up.railway.app/chat';
  const REQUEST_TIMEOUT_MS = 90000;
  const MAX_RETRIES = 2;
  const RETRY_DELAY_MS = 6000;

  const messagesEl = document.getElementById('dw-chat-messages');
  const inputEl = document.getElementById('dw-chat-input');
  const sendBtn = document.getElementById('dw-chat-send');
  if (!messagesEl || !inputEl || !sendBtn) return;

  let threadId = localStorage.getItem('dw_estimator_thread_id');
  if (!threadId) {
    threadId = 'shop_' + Math.random().toString(36).slice(2, 11);
    localStorage.setItem('dw_estimator_thread_id', threadId);
  }

  function addMsg(text, who) {
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    if (who === 'ai' && typeof marked !== 'undefined') {
      div.innerHTML = marked.parse(text);
      div.style.whiteSpace = 'normal';
    } else {
      div.textContent = text;
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.id = 'dw-typing';
    el.className = 'typing-indicator';
    el.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('dw-typing');
    if (el) el.remove();
  }

  /** Single attempt: returns Response or throws. */
  async function fetchChat(message, threadId, signal) {
    const resp = await fetch(CHAT_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer default-key' },
      body: JSON.stringify({ message, thread_id: threadId }),
      signal
    });
    if (resp.status === 502 || resp.status === 503) throw new Error('Server unavailable');
    return resp;
  }

  async function sendMessage() {
    const userMsg = inputEl.value.trim();
    if (!userMsg) return;

    inputEl.value = '';
    addMsg(userMsg, 'user');
    sendBtn.disabled = true;
    sendBtn.textContent = '...';

    let resp = null;
    let lastError = null;

    for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
      showTyping();
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
        resp = await fetchChat(userMsg, threadId, controller.signal);
        clearTimeout(timeoutId);
        break;
      } catch (e) {
        lastError = e;
        hideTyping();
        if (attempt < MAX_RETRIES) {
          addMsg('Waking up, please wait…', 'system');
          await new Promise(r => setTimeout(r, RETRY_DELAY_MS));
        }
      }
    }

    hideTyping();

    if (resp && resp.ok) {
      const data = await resp.json();
      addMsg(data.response || "I didn't get a response. Try again.", 'ai');
    } else if (resp) {
      if (resp.status === 429) addMsg("Slow down! You've sent too many messages. Please try again in a minute.", 'system');
      else if (resp.status === 403) {
        const errText = await resp.text();
        addMsg(errText || 'Access denied (403).', 'system');
      } else {
        addMsg("Sorry, I couldn't reach the estimator right now. Please try again.", 'system');
      }
    } else {
      const isTimeout = lastError && lastError.name === 'AbortError';
      addMsg(isTimeout ? 'The request took too long. Please try again in a moment.' : 'Error connecting to estimator. Please try again.', 'system');
    }

    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
    inputEl.focus();
  }

  addMsg("Hi — tell me what windows you're replacing (type + size) and whether you need installation.", 'ai');
  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keypress', function(e) { if (e.key === 'Enter') sendMessage(); });
})();
</script>
